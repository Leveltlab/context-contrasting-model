[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-contrasting-model"
version = "0.1.0"
description = "Six mean-field contextual-contrasting transition models."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "joblib",
    "matplotlib",
    "numpy",
    "pandas",
    "pyyaml",
    "seaborn",
    "torch>=2.5,<2.6",
]

[dependency-groups]
dev = ["jupyter"]

[project.scripts]
context-contrasting-model = "src.simulate:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "plotting*"]
